name: 🚦Validate Frontend (Format, Lint, Test)

on:
  workflow_call:
    inputs:
      checkout_repo:
        required: false
        type: string
      checkout_ref:
        required: false
        type: string
      env:
        required: false
        type: string
        description: Environment to setup for
        default: dev
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-validate.yaml"
  workflow_dispatch:
    inputs:
      env:
        description: "Environment override (prod|dev)"
        required: false
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write # This is required for requesting the JWT
  contents: write # This is required for actions/checkout

concurrency:
  group: frontend-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate frontend for ${{ (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch') && inputs.env || (github.ref_name == 'main' && 'prod' || 'dev') }}
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch') && inputs.env || (github.ref_name == 'main' && 'prod' || 'dev') }}
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.checkout_repo }}
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0
          lfs: true

      - name: 📦 Setup Workflow
        uses: ./.github/actions/setup
        with:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SA: ${{ vars.WIF_SA }}
          env-file: frontend/.env.development

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 24.x

      - name: 📦 Install dependencies
        run: npm ci
        working-directory: frontend

      - name: 🎨 Format Code
        shell: bash
        run: npm run format
        working-directory: frontend

      - name: 🔄 Auto-commit formatting
        if: github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@8621497c8c39c72f3e2a999a26b4ca1b5058a842 # v5.0.1
        with:
          commit_message: "chore(fmt): apply prettier formatting"
          file_pattern: frontend/**

      - name: 🚦 Lint Code
        run: npm run lint
        working-directory: frontend

      - name: 🔎 Type Check
        run: npm run type-check
        working-directory: frontend

      - name: 🧪 Run Tests
        run: npm run test:unit
        working-directory: frontend

      - name: 🏗️ Build static assets
        run: npm run build
        working-directory: frontend

      - name: 🔎 Verify static security resources
        shell: bash
        run: |
          set -euo pipefail
          test -s frontend/dist/.well-known/security.txt
          test -s frontend/dist/llms.txt
          ! grep -Fq '<!doctype html>' frontend/dist/.well-known/security.txt
          ! grep -Fq '<!doctype html>' frontend/dist/llms.txt

      - name: 🔐 Validate security metadata
        shell: bash
        run: |
          set -euo pipefail
          security_file=frontend/public/.well-known/security.txt
          grep -Eq '^Contact: mailto:[^ ]+$' "$security_file"
          grep -Eq '^Canonical: https://[^ ]+$' "$security_file"
          grep -Eq '^Policy: https://[^ ]+$' "$security_file"
          expiry=$(awk -F': ' '$1 == "Expires" {print $2}' "$security_file")
          test -n "$expiry"
          ! grep -Fq '<' "$security_file"
          expiry_epoch=$(date -u -j -f '%Y-%m-%dT%H:%M:%SZ' "$expiry" +%s 2>/dev/null || date -u -d "$expiry" +%s)
          now_epoch=$(date -u +%s)
          thirty_days=$((30 * 24 * 60 * 60))
          test "$expiry_epoch" -gt "$now_epoch"
          if [ $((expiry_epoch - now_epoch)) -lt "$thirty_days" ]; then
            echo "security.txt expires in fewer than 30 days" >&2
            exit 1
          fi
