name: 🚀 Build (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

env:
  TF_IN_AUTOMATION: true

jobs:
  opentofu-infra:
    name: 🪄 OpenTofu infra (prod)
    uses: ./.github/workflows/tf-plan-apply.yaml
    with:
      env: prod
      apply: false
      cwd: deployments/prod/0-infra
    secrets: inherit

  get_version:
    name: 🔢 Get next semantic version
    needs: opentofu-infra
    runs-on: ubuntu-latest
    outputs:
      next_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Required for semantic-release to analyze the full commit history
      - name: Get next version
        id: semantic
        uses: cycjimmy/semantic-release-action@cb425203a562475bca039ba4dbf90c7f9ac790f4 # v4.1.0
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            conventional-changelog-conventionalcommits
            conventional-changelog-writer@^7.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-backend:
    needs: get_version
    uses: ./.github/workflows/backend-build.yaml
    with:
      env: prod
      version: ${{ needs.get_version.outputs.next_version }}
    secrets: inherit

  build-frontend:
    needs: get_version
    uses: ./.github/workflows/frontend-build.yaml
    with:
      env: prod
      version: ${{ needs.get_version.outputs.next_version }}
    secrets: inherit

  build-bff:
    needs: get_version
    uses: ./.github/workflows/bff-build.yaml
    with:
      env: prod
      version: ${{ needs.get_version.outputs.next_version }}
    secrets: inherit

  opentofu-services:
    name: 🪄 OpenTofu services (prod)
    needs:
      - opentofu-infra
      - build-backend
      - build-frontend
      - build-bff
      - get_version
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    uses: ./.github/workflows/tf-plan-apply.yaml
    with:
      env: prod
      apply: false
      cwd: deployments/prod/1-services
      infra_outputs: ${{ needs.opentofu-infra.outputs.tf_outputs }}
      version: ${{ needs.get_version.outputs.next_version }}
    secrets: inherit

  create-release:
    name: 🚀 Create Release
    runs-on: ubuntu-latest
    needs:
      - get_version
      - opentofu-services
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@cb425203a562475bca039ba4dbf90c7f9ac790f4 # v4.1.0
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            conventional-changelog-conventionalcommits
            conventional-changelog-writer@^7.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
