name: 🚦Validate Backend (Format, Lint, Test)

on:
  workflow_call:
    inputs:
      checkout_repo:
        required: false
        type: string
      checkout_ref:
        required: false
        type: string
      env:
        required: false
        type: string
        description: Environment to setup for
        default: dev
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/backend-build.yaml
  workflow_dispatch:
    inputs:
      env:
        description: Environment override (prod|dev)
        required: false
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write # This is required for requesting the JWT
  contents: write # This is required for actions/checkout

concurrency:
  group: backend-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate backend for ${{ (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch') && inputs.env || (github.ref_name == 'main' && 'prod' || 'dev') }}
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch') && inputs.env || (github.ref_name == 'main' && 'prod' || 'dev') }}
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.checkout_repo }}
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0

      - name: 📦 Setup Workflow
        uses: ./.github/actions/setup
        with:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SA: ${{ vars.WIF_SA }}

      - name: 🐹 Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum

      - name: 🔎 Vet Code
        shell: bash
        run: go vet ./...
        working-directory: backend

      - name: 🚦 Format Code
        shell: bash
        run: go fmt ./...
        working-directory: backend

      - name: 🔄 Auto-commit formatting
        if: github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@8621497c8c39c72f3e2a999a26b4ca1b5058a842 # v5.0.1
        with:
          commit_message: "chore(fmt): apply go fmt"
          file_pattern: backend/**

      - name: 🚦 Update Swagger Docs
        shell: bash
        run: |
          export PATH=${PATH}:`go env GOPATH`/bin
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          swag init
        working-directory: backend

      - name: 🔄 Auto-commit formatting
        if: github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@8621497c8c39c72f3e2a999a26b4ca1b5058a842 # v5.0.1
        with:
          commit_message: "chore(docs): update swagger docs"
          file_pattern: backend/**

      - name: 🔎 Lint Code
        uses: golangci/golangci-lint-action@2226d7cb06a077cd73e56eedd38eecad18e5d837 # v6.5.0
        with:
          install-mode: goinstall
          working-directory: backend

      - name: 🧪 Run Tests
        shell: bash
        run: go test -v ./...
        working-directory: backend
